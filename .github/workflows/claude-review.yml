name: Claude Code Review

# เนื้อในย้ายไปที่ wangpharma-org/shared-workflows แล้ว — แก้ข้อความรีวิวที่นั่นที่เดียว
# ได้ผลทุก repo แทนการไล่แก้ 59 ที่
#
# `on:` อยู่ที่นี่โดยตั้งใจ — จังหวะที่จะให้รีวิวเป็นการตัดสินใจของ repo นี้ ไม่ใช่ของที่กลาง
on:
  pull_request:
    types: [opened]

jobs:
  review:
    uses: wangpharma-org/shared-workflows/.github/workflows/claude-review.yml@main
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
